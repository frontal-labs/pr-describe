name: "PR Describe"
description: "Drafts PR descriptions and change records from the diff, and turns them into changelogs."
inputs:
  pr_number:
    description: "Pull request number"
    required: true
    default: ${{ github.event.pull_request.number }}
  token:
    description: "GitHub token"
    required: false
    default: ${{ secrets.GITHUB_TOKEN }}
  model:
    description: "ggml-node model id (qwen2.5-0.5b, qwen2.5-1.5b, smollm2-360m). Empty uses the config file, then qwen2.5-1.5b"
    required: false
    default: ""
  write_file:
    description: "Also write .changes/<pr>.yml"
    required: false
    default: "false"
  dry_run:
    description: "Print without writing"
    required: false
    default: "false"
  allow_forks:
    description: "Allow forks (requires pull_request_target)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: PR Describe
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        GITHUB_TOKEN: ${{ inputs.token }}
        MODEL: ${{ inputs.model }}
        WRITE_FILE: ${{ inputs.write_file }}
        DRY_RUN: $inputs.dry_run
        ALLOW_FORKS: ${{ inputs.allow_fork }}
      run: |
        if [ "$ALLOW_FORKS" = "true" ]; then
          node dist/cli.js describe --pr "$PR_NUMBER"
        else
          node dist/cli.js describe --pr "$PR_NUMBER"
        fi
branding:
  icon: "file-text"
  color: "blue"