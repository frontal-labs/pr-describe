name: Fixtures

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 6AM UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-run all fixtures"
        required: false
        default: false
        type: boolean

jobs:
  fixtures:
    name: Fixture Accuracy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.force == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run fixtures (mock)
        run: bun test tests/fixtures.test.ts
        env:
          MOCK_DATA: "true"

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: .ggml-cache
          key: ggml-node-qwen2.5-1.5b-v1

      # Reports accuracy against the expected fixtures. Writes
      # tests/fixtures/eval-report.json, which the upload step below keeps.
      - name: Model eval
        run: bun run eval
        env:
          GGML_NODE_CACHE_DIR: ${{ github.workspace }}/.ggml-cache

      - name: Upload fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-report
          path: tests/fixtures/
          retention-days: 30