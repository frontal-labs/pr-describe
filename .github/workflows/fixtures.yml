name: Fixtures

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 6AM UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-run all fixtures"
        required: false
        default: false
        type: boolean

jobs:
  fixtures:
    name: Fixture Accuracy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.force == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run fixtures (mock)
        run: bun test tests/fixtures.test.ts
        env:
          MOCK_DATA: "true"

      - name: Run fixtures (real provider)
        if: ${{ secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY }}
        run: bun test tests/fixtures.test.ts
        env:
          MOCK_DATA: "false"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-report
          path: tests/fixtures/
          retention-days: 30