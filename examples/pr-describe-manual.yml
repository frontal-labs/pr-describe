name: PR Describe - Manual

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number
      model:
        description: "ggml-node model id"
        required: false
        default: ""

jobs:
  describe:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: .ggml-cache
          key: ggml-node-${{ github.event.inputs.model || 'qwen2.5-1.5b' }}-v1

      - name: Describe
        uses: ./
        env:
          GGML_NODE_CACHE_DIR: ${{ github.workspace }}/.ggml-cache
        with:
          pr_number: ${{ github.event.inputs.pr_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          model: ${{ github.event.inputs.model }}
